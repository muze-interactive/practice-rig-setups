<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4 L0 8 z" fill="#374151"/>
    </marker>
    <style><![CDATA[
      .title{font:600 24px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#111827;}
      .sub  {font:400 14px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#6b7280;}
      .l    {font:600 16px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#111827;text-anchor:middle;}
      .s    {font:400 13px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#4b5563;text-anchor:middle;}
      .p    {font:500 12px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#6b7280;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round;}
      .flow {stroke:#374151;stroke-width:2;fill:none;}
      .opt  {stroke-dasharray:5 5;}
    ]]></style>
  </defs>

  <text class="title" x="40" y="48">Performance Rig</text>
  <text class="sub"   x="40" y="72">Gig-ready — ELF as preamp, monitor amp and FOH DI; GK combo chained for bigger / outdoor stages</text>

  <!-- Bass -->
  <rect x="50" y="270" width="130" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text class="l" x="115" y="305">Bass</text>
  <text class="s" x="115" y="327">active pickups</text>

  <!-- FX / compressor -->
  <rect x="270" y="265" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="l" x="370" y="300">HX Stomp</text>
  <text class="s" x="370" y="322">or MXR mini compressor</text>

  <!-- Trace Elliot ELF -->
  <rect x="560" y="260" width="230" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text class="l" x="675" y="295">Trace Elliot ELF</text>
  <text class="s" x="675" y="317">preamp · 200W amp · DI</text>

  <!-- FOH PA -->
  <rect x="870" y="120" width="160" height="86" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="950" y="155">FOH PA</text>
  <text class="s" x="950" y="177">venue mains</text>

  <!-- TE 10" cab -->
  <rect x="560" y="450" width="230" height="86" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text class="l" x="675" y="485">TE 10&quot; Cab</text>
  <text class="s" x="675" y="507">stage monitor</text>

  <!-- GK Fusion 112 (optional extended monitor) -->
  <rect x="870" y="440" width="160" height="106" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="l" x="950" y="475">GK Fusion 112</text>
  <text class="s" x="950" y="497">optional — outdoor</text>
  <text class="s" x="950" y="515">extended monitor + DI</text>

  <!-- Bass -> FX -->
  <line class="flow" x1="180" y1="310" x2="270" y2="310" marker-end="url(#arr)"/>
  <text class="p" x="225" y="300">TS</text>

  <!-- FX -> ELF -->
  <line class="flow" x1="470" y1="310" x2="560" y2="310" marker-end="url(#arr)"/>
  <text class="p" x="515" y="300">TS</text>

  <!-- ELF DI -> FOH -->
  <path class="flow" d="M790 290 Q860 250 890 206" marker-end="url(#arr)"/>
  <text class="p" x="845" y="246">XLR DI (pre/post)</text>

  <!-- ELF speaker out -> TE cab -->
  <line class="flow" x1="675" y1="360" x2="675" y2="450" marker-end="url(#arr)"/>
  <text class="p" x="675" y="408">speaker out</text>

  <!-- ELF DI -> GK (optional chain) -->
  <path class="flow opt" d="M790 330 Q860 390 880 440" marker-end="url(#arr)"/>
  <text class="p" x="855" y="392">DI link</text>

  <!-- GK -> FOH (optional, pre-mode transparent) -->
  <path class="flow opt" d="M1000 440 Q1015 320 1000 206" marker-end="url(#arr)"/>
  <text class="p" x="1010" y="330">DI (pre)</text>
</svg>
