<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4 L0 8 z" fill="#374151"/>
    </marker>
    <style><![CDATA[
      .title{font:600 24px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#111827;}
      .sub  {font:400 14px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#6b7280;}
      .l    {font:600 16px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#111827;text-anchor:middle;}
      .s    {font:400 13px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#4b5563;text-anchor:middle;}
      .p    {font:500 12px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#6b7280;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round;}
      .flow {stroke:#374151;stroke-width:2;fill:none;}
      .panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:6 5;}
    ]]></style>
  </defs>

  <text class="title" x="40" y="48">Travel Practice / Jam Rig</text>
  <text class="sub"   x="40" y="72">All-in-the-box — HX Stomp is FX, preamp and USB interface; headphone out for zero-latency monitoring</text>

  <!-- Software panel -->
  <rect class="panel" x="690" y="110" width="330" height="120" rx="14"/>
  <text class="s" x="855" y="135" font-weight="600" fill="#374151">MacBook Air — Software</text>
  <text class="p" x="855" y="160">Loopback (virtual router)</text>
  <text class="p" x="855" y="180">Logic Pro · QuickTime · OBS</text>
  <text class="p" x="855" y="205">Backing tracks: Anytune · Moises · Browser</text>

  <!-- Bass -->
  <rect x="50" y="270" width="130" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text class="l" x="115" y="305">Bass</text>
  <text class="s" x="115" y="327">EHB (active/passive)</text>

  <!-- HX Stomp (FX + preamp + interface) -->
  <rect x="320" y="260" width="250" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="l" x="445" y="295">Line6 HX Stomp</text>
  <text class="s" x="445" y="317">FX · preamp · amp/IR sim</text>
  <text class="s" x="445" y="337">USB interface · HP out</text>

  <!-- MacBook Air -->
  <rect x="755" y="265" width="200" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="l" x="855" y="308">MacBook Air</text>
  <text class="s" x="855" y="330">workstation host</text>

  <!-- Headphones -->
  <rect x="320" y="440" width="250" height="86" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text class="l" x="445" y="475">Headphones</text>
  <text class="s" x="445" y="497">direct from HX Stomp — no latency</text>

  <!-- Bass -> HX Stomp -->
  <line class="flow" x1="180" y1="310" x2="320" y2="310" marker-end="url(#arr)"/>
  <text class="p" x="250" y="300">TS</text>

  <!-- HX Stomp -> MacBook Air (USB) -->
  <line class="flow" x1="570" y1="310" x2="755" y2="310" marker-end="url(#arr)"/>
  <text class="p" x="662" y="300">USB</text>
  <text class="p" x="662" y="332">(slight latency)</text>

  <!-- MacBook Air -> software panel -->
  <line class="flow" x1="855" y1="265" x2="855" y2="232" marker-end="url(#arr)"/>

  <!-- HX Stomp -> Headphones (direct) -->
  <line class="flow" x1="445" y1="360" x2="445" y2="440" marker-end="url(#arr)"/>
  <text class="p" x="445" y="404">HP out</text>
</svg>
