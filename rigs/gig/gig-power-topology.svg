<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 760" width="1340" height="760">
  <defs>
    <marker id="arrp" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4 L0 8 z" fill="#b45309"/>
    </marker>
    <style><![CDATA[
      .title{font:600 26px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#111827;}
      .sub  {font:400 14px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#6b7280;}
      .l    {font:600 15px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#111827;text-anchor:middle;}
      .s    {font:400 12px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#4b5563;text-anchor:middle;}
      .p    {font:500 11px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#92400e;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round;}
      .pw   {stroke:#b45309;stroke-width:2;fill:none;}
      .panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:6 5;}
      .grp  {fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4;}
      .lh   {font:600 14px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#374151;}
      .lb   {font:400 12.5px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#4b5563;}
      .gl   {font:600 12px ui-sans-serif,system-ui,'Segoe UI',Arial;fill:#64748b;}
    ]]></style>
  </defs>

  <text class="title" x="40" y="50">Gig — Power Topology</text>
  <text class="sub"   x="40" y="76">120 VAC distributed from the venue wall via two 50 ft runs; stage areas fan out to power strips. DC / USB devices grouped by their strip.</text>

  <!-- ===================== WALL ===================== -->
  <rect x="570" y="100" width="200" height="58" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="l" x="670" y="126">Venue Wall AC</text>
  <text class="s" x="670" y="146">120 VAC</text>

  <!-- ===================== DISTRIBUTION ===================== -->
  <rect x="120" y="210" width="240" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="l" x="240" y="238">Power Conditioner</text>
  <text class="s" x="240" y="258">FOH rack</text>

  <rect x="900" y="210" width="300" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="l" x="1050" y="238">Stage Fanout</text>
  <text class="s" x="1050" y="258">to area power strips (10 ft ext)</text>

  <!-- ===================== FOH RACK GROUP ===================== -->
  <rect class="grp" x="100" y="300" width="280" height="300" rx="12"/>
  <text class="gl" x="116" y="320">FOH RACK (120 VAC)</text>

  <rect x="120" y="332" width="240" height="52" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="240" y="364">Yamaha Mixer</text>

  <rect x="120" y="400" width="240" height="52" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="240" y="432">Carvin Power Amp</text>

  <rect x="120" y="468" width="240" height="52" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="240" y="500">QCS Power Amp</text>

  <rect x="120" y="536" width="240" height="52" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="240" y="568">Behringer Sub Amp</text>

  <!-- ===================== STAGE STRIPS ===================== -->
  <rect x="430" y="300" width="180" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="l" x="520" y="326">Guitar Strip</text>
  <text class="s" x="520" y="344">guitarist area</text>

  <rect x="640" y="300" width="180" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="l" x="730" y="326">Drums Strip</text>
  <text class="s" x="730" y="344">drummer area</text>

  <rect x="850" y="300" width="200" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="l" x="950" y="326">Bass Strip</text>
  <text class="s" x="950" y="344">bassist area</text>

  <rect x="1100" y="300" width="200" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="l" x="1200" y="326">Bass-Monitor Strip</text>
  <text class="s" x="1200" y="344">bassist · +1 strip</text>

  <!-- ===================== CONSUMERS ===================== -->
  <!-- Guitar -->
  <rect x="430" y="410" width="180" height="60" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="520" y="438">Guitar Combo Amp</text>
  <text class="s" x="520" y="458">guitarist · 120 VAC</text>

  <!-- Drums: cooling fan (powered) + mics note -->
  <rect x="640" y="410" width="180" height="56" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="730" y="438">Cooling Fan</text>
  <text class="s" x="730" y="456">drummer · 120 VAC</text>

  <rect x="640" y="480" width="180" height="50" rx="9" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="s" x="730" y="503">Mics: phantom</text>
  <text class="s" x="730" y="521">from mixer — no AC.</text>

  <!-- Bass strip consumers -->
  <rect x="850" y="410" width="200" height="50" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="l" x="950" y="440">HX Stomp · 12 VDC</text>

  <rect x="850" y="472" width="200" height="50" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text class="l" x="950" y="502">MXR Comp · 9 VDC</text>

  <rect x="850" y="534" width="200" height="50" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text class="l" x="950" y="564">iPad · USB-C</text>

  <rect x="850" y="596" width="200" height="50" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text class="l" x="950" y="626">BT / TRS adapter · USB-C</text>

  <!-- Bass-monitor strip consumers -->
  <rect x="1100" y="410" width="200" height="56" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="1200" y="442">Trace Elliot ELF</text>
  <text class="s" x="1200" y="460">120 VAC</text>

  <rect x="1100" y="482" width="200" height="56" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="l" x="1200" y="514">GK Fusion 112</text>
  <text class="s" x="1200" y="532">120 VAC</text>

  <!-- ===================== POWER EDGES ===================== -->
  <!-- wall -> conditioner / stage fanout -->
  <path class="pw" d="M600 150 Q360 175 270 210" marker-end="url(#arrp)"/>
  <text class="p" x="420" y="172">50 ft ext #1</text>
  <path class="pw" d="M740 150 Q980 175 1020 210" marker-end="url(#arrp)"/>
  <text class="p" x="930" y="172">50 ft ext #2</text>

  <!-- conditioner -> rack (daisy down) -->
  <line class="pw" x1="240" y1="274" x2="240" y2="332" marker-end="url(#arrp)"/>
  <line class="pw" x1="240" y1="384" x2="240" y2="400" marker-end="url(#arrp)"/>
  <line class="pw" x1="240" y1="452" x2="240" y2="468" marker-end="url(#arrp)"/>
  <line class="pw" x1="240" y1="520" x2="240" y2="536" marker-end="url(#arrp)"/>

  <!-- stage fanout -> strips -->
  <path class="pw" d="M960 274 Q700 285 520 300" marker-end="url(#arrp)"/>
  <text class="p" x="640" y="284">10 ft ext</text>
  <path class="pw" d="M1000 274 Q860 287 730 300" marker-end="url(#arrp)"/>
  <text class="p" x="828" y="288">10 ft ext</text>
  <line class="pw" x1="1010" y1="274" x2="965" y2="300" marker-end="url(#arrp)"/>
  <text class="p" x="1010" y="290">10 ft ext</text>
  <line class="pw" x1="1050" y1="328" x2="1100" y2="328" marker-end="url(#arrp)"/>
  <text class="p" x="1075" y="318">+1</text>

  <!-- strips -> consumers -->
  <line class="pw" x1="520" y1="356" x2="520" y2="410" marker-end="url(#arrp)"/>
  <line class="pw" x1="730" y1="356" x2="730" y2="410" marker-end="url(#arrp)"/>

  <line class="pw" x1="950" y1="356" x2="950" y2="410" marker-end="url(#arrp)"/>
  <line class="pw" x1="950" y1="460" x2="950" y2="472" marker-end="url(#arrp)"/>
  <line class="pw" x1="950" y1="522" x2="950" y2="534" marker-end="url(#arrp)"/>
  <line class="pw" x1="950" y1="584" x2="950" y2="596" marker-end="url(#arrp)"/>

  <line class="pw" x1="1200" y1="356" x2="1200" y2="410" marker-end="url(#arrp)"/>
  <line class="pw" x1="1200" y1="466" x2="1200" y2="482" marker-end="url(#arrp)"/>

  <!-- ===================== BATTERY / NO-AC PANEL ===================== -->
  <rect class="panel" x="430" y="540" width="380" height="120" rx="14"/>
  <text class="lh" x="450" y="566">No AC distribution needed</text>
  <text class="lb" x="450" y="592">• Active basses — 9 V battery (keep spares)</text>
  <text class="lb" x="450" y="614">• TC Helicon Mic Mechanic — 9 V battery / adapter</text>
  <text class="lb" x="450" y="636">• iPhone — Lightning (charge off USB)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect class="panel" x="40" y="620" width="370" height="120" rx="14"/>
  <text class="lh" x="58" y="646">Power type</text>
  <rect x="58" y="660" width="20" height="14" rx="4" fill="#ffe4e6" stroke="#e11d48"/>
  <text class="lb" x="86" y="672">120 VAC</text>
  <rect x="200" y="660" width="20" height="14" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text class="lb" x="228" y="672">12 VDC adapter</text>
  <rect x="58" y="686" width="20" height="14" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
  <text class="lb" x="86" y="698">9 VDC adapter</text>
  <rect x="200" y="686" width="20" height="14" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text class="lb" x="228" y="698">9 V battery</text>
  <rect x="58" y="712" width="20" height="14" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="lb" x="86" y="724">USB-C / Lightning</text>
  <rect x="200" y="712" width="20" height="14" rx="4" fill="#f1f5f9" stroke="#64748b"/>
  <text class="lb" x="228" y="724">AC distribution</text>
</svg>
