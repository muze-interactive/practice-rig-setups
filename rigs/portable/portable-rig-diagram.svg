<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Helvetica, Arial, sans-serif" stroke="#000" stroke-width="2" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
    <style><![CDATA[
      .label{fill:#000;font-size:18px;text-anchor:middle;dominant-baseline:middle;}
      .sublabel{fill:#000;font-size:14px;text-anchor:middle;dominant-baseline:middle;}
      .portlabel{fill:#000;font-size:12px;text-anchor:start;dominant-baseline:middle;}
      .box{fill:#fff;stroke:#000;stroke-width:2;rx:8;ry:8;}
      .dotted{stroke-dasharray:4 4;}
      .highlight{fill:#e6f3ff;stroke:#0066cc;stroke-width:2;}
      .title{fill:#000;font-size:22px;font-weight:bold;text-anchor:middle;dominant-baseline:middle;stroke:none;}
    ]]></style>
  </defs>

  <text class="title" x="600" y="40">Portable Practice Rig — Dry, DAW FX</text>

  <!-- ========= HARDWARE ROW ========= -->
  <!-- Ibanez EHB Bass -->
  <g id="bass" transform="translate(100,260)">
    <rect class="box" x="-60" y="-40" width="120" height="80"/>
    <text class="label" x="0" y="-4">Ibanez EHB</text>
    <text class="sublabel" x="0" y="20">Bass</text>
  </g>

  <!-- Apogee Jam or Duet -->
  <g id="apogee" transform="translate(370,260)">
    <rect class="box highlight" x="-110" y="-45" width="220" height="90"/>
    <text class="label" x="0" y="-8">Apogee Jam</text>
    <text class="sublabel" x="0" y="12">or Apogee Duet</text>
    <text class="sublabel" x="0" y="32">A/D &amp; D/A Interface</text>
  </g>

  <!-- MacBook Pro -->
  <g id="mac" transform="translate(700,260)">
    <rect class="box" x="-120" y="-50" width="240" height="100"/>
    <text class="label" x="0" y="-4">MacBook Pro</text>
    <text class="sublabel" x="0" y="22">Host</text>
  </g>

  <!-- Headphones -->
  <g id="headphones" transform="translate(370,420)">
    <rect class="box" x="-100" y="-40" width="200" height="80"/>
    <text class="label" x="0" y="-4">Headphones</text>
    <text class="sublabel" x="0" y="20">Monitor Output</text>
  </g>

  <!-- ========= SOFTWARE CALLOUT ========= -->
  <g id="software" transform="translate(700,90)">
    <rect class="box dotted" x="-200" y="-50" width="400" height="220"/>
    <text class="label" x="0" y="-25">Mac Software Routing</text>

    <!-- Mac Apps group -->
    <g id="macapps" transform="translate(-130,20)">
      <rect class="box" x="-80" y="-25" width="160" height="50"/>
      <text class="sublabel" x="0" y="-4">Mac Apps</text>
      <text class="portlabel" x="-70" y="14">Anytune / Moises / Browser</text>
    </g>

    <!-- Loopback Router -->
    <g id="loopback" transform="translate(0,80)">
      <rect class="box highlight" x="-90" y="-35" width="180" height="70"/>
      <text class="sublabel" x="0" y="-8">Loopback</text>
      <text class="sublabel" x="0" y="12">RecordingRouter</text>
    </g>

    <!-- Logic Pro DAW -->
    <g id="logic" transform="translate(130,20)">
      <rect class="box" x="-80" y="-25" width="160" height="50"/>
      <text class="sublabel" x="0" y="-4">Logic Pro</text>
      <text class="portlabel" x="-70" y="14">DAW (FX, mix, master)</text>
    </g>
  </g>

  <!-- ========= SIGNAL LINES ========= -->
  <!-- Bass direct to Apogee -->
  <line x1="160" y1="260" x2="260" y2="260" marker-end="url(#arrow)"/>
  <text class="portlabel" x="170" y="246">1/4" TS</text>

  <!-- Apogee to MacBook (USB) -->
  <line x1="480" y1="260" x2="580" y2="260" marker-end="url(#arrow)"/>
  <text class="portlabel" x="500" y="246">USB</text>

  <!-- Apogee to Headphones -->
  <line x1="370" y1="305" x2="370" y2="380" marker-end="url(#arrow)"/>
  <text class="portlabel" x="380" y="345">Headphone Out</text>

  <!-- ===== Software internal lines ===== -->
  <!-- Mac Apps to Loopback -->
  <line x1="620" y1="110" x2="660" y2="140" marker-end="url(#arrow)"/>

  <!-- Apogee input feed into Loopback (virtual) -->
  <line x1="700" y1="210" x2="700" y2="160" marker-end="url(#arrow)"/>
  <text class="portlabel" x="710" y="185">Apogee Input</text>

  <!-- Loopback to Logic Pro -->
  <line x1="700" y1="180" x2="800" y2="110" marker-end="url(#arrow)"/>
  <text class="portlabel" x="755" y="140">Ch 1–4</text>

  <!-- Loopback Monitor back to Apogee -->
  <line x1="700" y1="180" x2="700" y2="250" marker-end="url(#arrow)"/>
  <text class="portlabel" x="580" y="220">Monitor Mix</text>

  <!-- Logic Pro playback to Apogee -->
  <line x1="800" y1="110" x2="800" y2="250" marker-end="url(#arrow)"/>
  <text class="portlabel" x="810" y="180">Playback</text>

  <!-- ========= PORTABLE RIG FEATURES ========= -->
  <g id="features" transform="translate(100,510)">
    <text class="label" x="0" y="0" text-anchor="start">Portable Rig Features:</text>
    <text class="portlabel" x="0" y="22" text-anchor="start">• Compact Ibanez EHB</text>
    <text class="portlabel" x="0" y="39" text-anchor="start">• Apogee Jam or Duet — single-cable interface</text>
    <text class="portlabel" x="0" y="56" text-anchor="start">• Same Loopback RecordingRouter as the Home Studio</text>
    <text class="portlabel" x="0" y="73" text-anchor="start">• Logic Pro on MacBook Pro — FX, mix, master in the box</text>
    <text class="portlabel" x="0" y="90" text-anchor="start">• Headphone monitoring for portability</text>
  </g>

</svg>
